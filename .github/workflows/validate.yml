name: Validate

on:
  push:
    branches:
      - main
      - 'chatgpt/**'
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair missing Capacitor CLI dependency
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/chatgpt/')
        run: |
          npm install --save-dev --save-exact @capacitor/cli@8.5.1
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "fix(deps): add missing Capacitor CLI"
            git push
          fi

      - name: Type-check and build
        run: npm run build
